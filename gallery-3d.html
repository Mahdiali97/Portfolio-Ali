<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Card Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset ──────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    /* ─── Scene ──────────────────────────────────────── */
    body {
      height: 100vh;
      perspective: 900px;
      overflow: hidden;
      display: grid;
      place-items: center;

      /* Deep cinematic gradient */
      background: radial-gradient(ellipse at 50% 30%, #1a2240 0%, #0b0d18 60%, #060810 100%);
      font-family: 'Inter', sans-serif;
    }

    /* Animated ambient background orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      animation: drift 14s ease-in-out infinite alternate;
    }

    body::before {
      width: 600px; height: 600px;
      top: -100px; left: -120px;
      background: radial-gradient(circle, rgba(79, 120, 255, 0.18) 0%, transparent 70%);
    }

    body::after {
      width: 500px; height: 500px;
      bottom: -120px; right: -80px;
      background: radial-gradient(circle, rgba(180, 80, 255, 0.14) 0%, transparent 70%);
      animation-delay: -7s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 60px) scale(1.12); }
    }

    /* ─── Floor grid (perspective grid) ─────────────── */
    .floor-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .floor-grid::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -20%;
      right: -20%;
      height: 55%;
      background:
        linear-gradient(90deg, rgba(79,120,255,0.07) 1px, transparent 1px),
        linear-gradient(0deg, rgba(79,120,255,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(400px) rotateX(72deg);
      transform-origin: bottom center;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 70%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 70%);
    }

    /* ─── Main stage ─────────────────────────────────── */
    main {
      position: relative;
      transform-style: preserve-3d;
      width: 50vmin;
      height: 75vmin;
      transition: transform 700ms cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    /* ─── Article cards ──────────────────────────────── */
    article {
      position: absolute;
      inset: 0;

      /* Chrome-only glowing reflection */
      -webkit-box-reflect: below 36px
        linear-gradient(
          transparent 0%,
          transparent 50%,
          rgba(79, 120, 255, 0.06) 70%,
          rgba(255, 255, 255, 0.14) 100%
        );
    }

    /* ─── Glow halo behind each card (overflow shadow) ── */
    article::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 22px;
      filter: blur(38px) brightness(0.55);
      opacity: 0;
      z-index: -1;
      transition: opacity 500ms ease, filter 400ms ease;
      transform: translateZ(-1px);
    }

    article:hover::before,
    article:focus-within::before {
      opacity: 1;
    }

    /* Each card has its own halo color defined via data-color */
    article[data-color="violet"]::before   { background: rgba(148, 100, 255, 0.55); }
    article[data-color="cyan"]::before     { background: rgba(56, 200, 240, 0.45); }
    article[data-color="rose"]::before     { background: rgba(240, 80, 140, 0.45); }

    /* ─── Button ─────────────────────────────────────── */
    button {
      border: 0; outline: 0; cursor: pointer;
      width: 100%; height: 100%;
      overflow: hidden;
      border-radius: 16px;
      transition:
        transform 350ms cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 250ms ease;
      position: relative;
      background: transparent;

      /* Frosted glass rim */
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 8px 32px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.12);
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(
        160deg,
        rgba(255,255,255,0.14) 0%,
        transparent 40%,
        transparent 60%,
        rgba(0,0,0,0.2) 100%
      );
      pointer-events: none;
      z-index: 2;
      transition: opacity 300ms ease;
    }

    button:hover::after,
    button:focus-visible::after { opacity: 0.6; }

    button:focus-visible {
      box-shadow:
        0 0 0 3px rgba(79, 120, 255, 0.8),
        0 8px 32px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.12);
    }

    button:focus:not(:focus-visible) {
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 8px 32px rgba(0,0,0,0.45);
    }

    button:hover,
    button:focus-visible {
      transform: scale(1.04) translateY(-5%) translateZ(0);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.15),
        0 24px 60px rgba(0,0,0,0.55),
        0 0 80px rgba(79,120,255,0.12),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    /* ─── Image ──────────────────────────────────────── */
    img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1), filter 300ms ease;
      filter: brightness(0.88) saturate(1.1);
    }

    button:hover img,
    button:focus-visible img {
      transform: scale(1.06);
      filter: brightness(1) saturate(1.2);
    }

    /* ─── Card label overlay ─────────────────────────── */
    .card-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 40px 18px 18px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      z-index: 3;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 300ms ease, transform 300ms ease;
      pointer-events: none;
    }

    button:hover .card-label,
    button:focus-visible .card-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* ─── Animated scan line (creative) ─────────────── */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      z-index: 4;
      pointer-events: none;
      animation: scanDown 4s ease-in-out infinite;
      opacity: 0;
    }

    button:hover .scan-line {
      opacity: 1;
    }

    @keyframes scanDown {
      0%   { top: -2px; opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.4; }
      100% { top: 102%; opacity: 0; }
    }

    /* ─── Shadow blob beneath scene ─────────────────── */
    .shadow-blob {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 62vmin;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(79,120,255,0.22) 0%, transparent 75%);
      filter: blur(18px);
      pointer-events: none;
      z-index: 0;
      animation: blobPulse 3s ease-in-out infinite alternate;
    }

    @keyframes blobPulse {
      from { opacity: 0.7; transform: translateX(-50%) scaleX(0.9); }
      to   { opacity: 1;   transform: translateX(-50%) scaleX(1.1); }
    }

    /* ─── Overflowing glow shadow effect ─────────────── */
    .overflow-shadow {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
      bottom: calc(50vh - 40vmin - 60px);
      width: 80vmin;
      height: 120px;

      background:
        radial-gradient(ellipse 65% 55% at 22% 100%,  rgba(148, 100, 255, 0.32) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 50% 100%,  rgba(79,  120, 255, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 65% 55% at 78% 100%,  rgba(56,  200, 240, 0.26) 0%, transparent 70%);
      filter: blur(24px);

      animation: overflowPulse 5s ease-in-out infinite alternate;
    }

    @keyframes overflowPulse {
      0%   { opacity: 0.65; transform: translateX(-50%) scaleX(0.96) scaleY(0.9); }
      50%  { opacity: 0.9; }
      100% { opacity: 0.8;  transform: translateX(-50%) scaleX(1.08) scaleY(1.1); }
    }

    /* ─── Hint text ──────────────────────────────────── */
    .hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.28);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 10;
      pointer-events: none;
      animation: hintFade 3s ease-out 1.5s forwards;
      opacity: 0;
    }

    @keyframes hintFade {
      0%   { opacity: 0; transform: translateX(-50%) translateY(4px); }
      20%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      80%  { opacity: 0.6; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="floor-grid" aria-hidden="true"></div>
  <div class="overflow-shadow" aria-hidden="true"></div>
  <div class="shadow-blob" aria-hidden="true"></div>

  <main id="main-stage"></main>

  <p class="hint" aria-hidden="true">Click a card to focus</p>

  <script>
    const articles = new Map([
      ["6392322", { tx: "-90%", tz: "-70vmin", ry: "62deg",  color: "violet", label: "Mountain Light" }],
      ["1761279", { tz: "-110vmin",                           color: "cyan",   label: "Forest Path"    }],
      ["1679772", { tx: "90%",  tz: "-70vmin", ry: "-62deg", color: "rose",   label: "Still Water"    }]
    ]);

    window.addEventListener("load", () => {
      const main = document.getElementById("main-stage");

      for (const [id, data] of articles.entries()) {
        main.appendChild(makeArticleElement(id, data));
      }

      document.addEventListener("click", ({ target }) => {
        const targetId = target.closest("article")?.id;
        let [itx, itz, iry] = [0, 0, 0];

        if (targetId && main.dataset.focus !== targetId) {
          const { tx, tz, ry } = articles.get(targetId);
          [itx, itz, iry] = [tx, tz, ry].map(inverseTransformation);
          main.dataset.focus = targetId;
        } else {
          delete main.dataset.focus;
        }

        main.style.transform = `rotateY(${iry}) translate3d(${itx}, 0, ${itz})`;
      });
    });

    function inverseTransformation(t) {
      if (!t) return 0;
      const [, value, unit] = t.match(/(-?\d+)(.*)/);
      return `${-Number(value)}${unit}`;
    }

    function makeArticleElement(id, { tx = 0, tz = 0, ry = 0, color = "cyan", label = "" }) {
      const scanLine = document.createElement("div");
      scanLine.className = "scan-line";

      const cardLabel = document.createElement("div");
      cardLabel.className = "card-label";
      cardLabel.textContent = label;

      const img = document.createElement("img");
      img.src = `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500`;
      img.alt = label || "Gallery card";
      img.loading = "lazy";

      const button = document.createElement("button");
      button.appendChild(img);
      button.appendChild(scanLine);
      button.appendChild(cardLabel);
      button.setAttribute("aria-label", label || "Gallery item");

      const el = document.createElement("article");
      el.id = id;
      el.dataset.color = color;
      el.style.transform = `translate3d(${tx}, 0, ${tz}) rotateY(${ry})`;
      el.appendChild(button);

      return el;
    }
  </script>
</body>
</html>
