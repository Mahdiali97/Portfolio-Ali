  <!-- Journal 3D Gallery Script -->
  <script>
    /* ── Media data ─────────────────────────────────────────────── */
    const PHOTOS = [
      {
        type: 'img',
        src: 'assets/img/Album/ComasPro1.jpg',
        caption: 'ComasPro — visiting schools to maintain computers for free'
      },
      {
        type: 'img',
        src: 'assets/img/Album/ComasPro2.jpg',
        caption: 'ComasPro — hands-on computer maintenance at local schools'
      },
      {
        type: 'img',
        src: 'assets/img/Album/DeanList.jpg',
        caption: 'Receiving my Dean List award'
      },
      {
        type: 'img',
        src: 'assets/img/Album/FCDO.jpg',
        caption: 'Certificate of completion — DevOps programme'
      },
      {
        type: 'img',
        src: 'assets/img/Album/KHARpresent.jpg',
        caption: 'Presenting KHAR — Full-Stack hostel project, 1st place'
      },
      {
        type: 'img',
        src: 'assets/img/Album/ProjectPresent.jpg',
        caption: 'Presenting my internship project to my supervisor'
      },
      {
        type: 'img',
        src: 'assets/img/Album/iierich.jpg',
        caption: 'iieRich programme — presenting UniPerks as final year project'
      },
      {
        type: 'img',
        src: 'assets/img/Album/SyncFura.jpg',
        caption: 'SyncFura — completing 14 weeks DevOps programme with the team'
      },
      {
        type: 'video',
        src: 'assets/img/Album/Uniperks.mp4',
        caption: 'Presenting the UniPerks app to clients'
      },
    ];

    /* ── Fan layout transforms (gallery-3d style) ────────────── */
    const FAN = {
      left:   { tx: '-90%',  tz: '-70vmin', ry: '62deg'  },
      center: { tx: '0px',   tz: '-110vmin', ry: '0deg'   },
      right:  { tx: '90%',   tz: '-70vmin', ry: '-62deg' },
    };

    const HALO_COLORS = ['violet', 'cyan', 'rose'];
    const AUTO_MS  = 5000;
    const TRANS_MS = 650;

    let current    = 0;
    let isAnimating = false;
    let isZoomed    = false;
    let autoTimer   = null;

    const deck    = document.getElementById('journal-deck');
    const pagesEl = document.getElementById('journal-pages');

    /* ── Build cards ─────────────────────────────────────────── */
    function buildCards() {
      deck.innerHTML = '';

      PHOTOS.forEach((p, i) => {
        /* Outer article (handles 3D position + reflection) */
        const card = document.createElement('div');
        card.className = 'j-card';
        card.dataset.index = i;
        card.dataset.halo  = HALO_COLORS[i % HALO_COLORS.length];

        /* Inner button (handles overflow:hidden, glass, clipping) */
        const btn = document.createElement('button');
        btn.className = 'j-card-btn';
        btn.setAttribute('aria-label', p.caption || 'Journal photo');

        if (p.type === 'video') {
          const vid = document.createElement('video');
          vid.src = p.src;
          vid.autoplay = false;
          vid.loop  = true;
          vid.muted = true;
          vid.playsInline = true;
          btn.appendChild(vid);
          card._vid = vid;
        } else if (p.src) {
          const img = document.createElement('img');
          img.src      = p.src;
          img.alt      = p.caption || '';
          img.draggable = false;
          img.loading  = 'lazy';
          btn.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'j-card-placeholder';
          ph.innerHTML = `<i class="bi bi-image"></i><span>${p.caption || 'Photo'}</span>`;
          btn.appendChild(ph);
        }

        /* Animated scan line */
        const scanLine = document.createElement('div');
        scanLine.className = 'j-card-scanline';
        btn.appendChild(scanLine);

        /* Caption overlay */
        if (p.caption) {
          const cap = document.createElement('div');
          cap.className = 'j-card-caption';
          cap.textContent = p.caption;
          btn.appendChild(cap);
        }

        card.appendChild(btn);
        deck.appendChild(card);

        /* Click handler */
        btn.addEventListener('click', (e) => {
          e.stopPropagation(); // prevent scene click from firing immediately
          if (isAnimating) return;

          if (isZoomed) {
            /* Click anywhere when zoomed → zoom out */
            zoomOut();
          } else {
            /* Find current position of this card */
            const leftIdx  = ((current - 1) + PHOTOS.length) % PHOTOS.length;
            const rightIdx = (current + 1) % PHOTOS.length;
            
            let posName = 'center';
            if (i === leftIdx) posName = 'left';
            if (i === rightIdx) posName = 'right';
            
            zoomIn(posName, i);
          }
        });
      });

      /* Click background to zoom out */
      document.getElementById('journal-scene').addEventListener('click', () => {
        if (isZoomed) zoomOut();
      });

      pagesEl.textContent = `— ${PHOTOS.length} Pages`;
      render();
    }

    /* ── Render fan layout (3 visible cards) ──────────────────── */
    function render() {
      const cards = deck.querySelectorAll('.j-card');
      const total = PHOTOS.length;

      /* Determine neighbours with wrapping */
      const leftIdx  = ((current - 1) + total) % total;
      const rightIdx = (current + 1) % total;

      cards.forEach((card, i) => {
        const isActive = (i === current);
        const isLeft   = (i === leftIdx);
        const isRight  = (i === rightIdx);
        const isVisible = isActive || isLeft || isRight;

        let pos;
        if (isLeft)        pos = FAN.left;
        else if (isRight)  pos = FAN.right;
        else if (isActive) pos = FAN.center;

        if (isVisible) {
          card.style.transform = `translate3d(${pos.tx}, 0px, ${pos.tz}) rotateY(${pos.ry})`;
        } else {
          /* Push hidden cards far away so they don't flicker */
          card.style.transform = 'translate3d(0px, 0px, -200vmin) scale(0.5)';
        }

        card.classList.toggle('j-card--active', isActive);
        card.classList.toggle('j-card--visible', isVisible);

        /* Play video only when active */
        if (card._vid) {
          if (isActive) card._vid.play().catch(() => {});
          else          { card._vid.pause(); card._vid.currentTime = 0; }
        }
      });
    }

    /* ── Zoom in / out ───────────────────────────────────────── */
    function zoomIn(posName, idx) {
      const pos = FAN[posName];
      const itx = inv(pos.tx);
      const itz = inv(pos.tz);
      const iry = inv(pos.ry);
      
      deck.style.transform = `rotateY(${iry}) translate3d(${itx}, 0px, ${itz})`;
      
      isZoomed = true;
      deck.classList.add('deck-zoomed');
      clearInterval(autoTimer);

      const cards = deck.querySelectorAll('.j-card');
      cards.forEach((c, i) => {
        const isFocused = (i === idx);
        c.classList.toggle('j-card--focused', isFocused);
        if (c._vid) {
          if (isFocused) c._vid.play().catch(() => {});
          else { c._vid.pause(); }
        }
      });
    }

    function zoomOut() {
      deck.style.transform = '';
      isZoomed = false;
      deck.classList.remove('deck-zoomed');
      
      const cards = deck.querySelectorAll('.j-card');
      cards.forEach(c => c.classList.remove('j-card--focused'));
      
      startAuto();
      render();
    }

    function inv(t) {
      if (!t || t === '0' || t === '0px') return '0px';
      const m = t.match(/(-?\d+)(.*)/);
      if (!m) return '0px';
      return `${-Number(m[1])}${m[2]}`;
    }

    /* ── Navigate ─────────────────────────────────────────────── */
    function goTo(idx) {
      if (isAnimating || isZoomed) return;
      isAnimating = true;
      current = ((idx % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
      render();
      setTimeout(() => { isAnimating = false; }, TRANS_MS);
      clearInterval(autoTimer);
      startAuto();
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    /* ── Auto advance ─────────────────────────────────────────── */
    function startAuto() {
      clearInterval(autoTimer);
      autoTimer = setInterval(next, AUTO_MS);
    }

    /* ── Drag / swipe ─────────────────────────────────────────── */
    let dragStartX = null;
    let dragDelta  = 0;

    function onDragStart(x) { dragStartX = x; dragDelta = 0; }
    function onDragMove(x)  { if (dragStartX !== null) dragDelta = x - dragStartX; }
    function onDragEnd() {
      if (dragStartX === null) return;
      if      (dragDelta < -50) next();
      else if (dragDelta >  50) prev();
      dragStartX = null;
    }

    const sceneEl = document.getElementById('journal-scene');
    sceneEl.addEventListener('mousedown',  e => onDragStart(e.clientX));
    sceneEl.addEventListener('mousemove',  e => onDragMove(e.clientX));
    sceneEl.addEventListener('mouseup',    onDragEnd);
    sceneEl.addEventListener('mouseleave', onDragEnd);
    sceneEl.addEventListener('touchstart', e => onDragStart(e.touches[0].clientX), { passive: true });
    sceneEl.addEventListener('touchmove',  e => onDragMove(e.touches[0].clientX),  { passive: true });
    sceneEl.addEventListener('touchend',   onDragEnd);

    /* ── Keyboard ─────────────────────────────────────────────── */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'Escape' && isZoomed) zoomOut();
    });

    /* ── Init ─────────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof AOS !== 'undefined') AOS.init({ once: true, duration: 700 });
      buildCards();
      startAuto();
    });
  </script>
