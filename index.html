  <!-- Typed effect -->
  <script>
    const typedTextElement = document.querySelector('.typed-text-bazil');
    const textArray = ['Software Engineer', 'Web Developer', 'UI/UX Designer'];
    let textIndex = 0;
    let charIndex = 0;

    function type() {
      if (charIndex < textArray[textIndex].length) {
        typedTextElement.textContent += textArray[textIndex].charAt(charIndex);
        charIndex++;
        setTimeout(type, 100);
      } else {
        setTimeout(erase, 2000);
      }
    }

    function erase() {
      if (charIndex > 0) {
        typedTextElement.textContent = textArray[textIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(erase, 50);
      } else {
        textIndex = (textIndex + 1) % textArray.length;
        setTimeout(type, 1000);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Init AOS
      if (typeof AOS !== 'undefined') {
        AOS.init({ once: true, duration: 700 });
      }
      // Start typing
      setTimeout(type, 600);
    });
  </script>
