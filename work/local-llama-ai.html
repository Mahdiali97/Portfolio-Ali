c catalog website. There was no integrated checkout system for students to purchase official merchandise.\n\n- Fragmented user journey caused by external Shopee redirects\n- No centralised native app for purchases and voucher redemption\n- Lack of university control over the third-party shopping experience\n- Inability to integrate student-focused incentives like digital coins\n\n\u003cdiv style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', margin: '20px 0' }}\u003e\n  \u003cimg src=\"/images/projects/uniperks-before-home.png\" alt=\"Before Home\" style={{ width: '100%', borderRadius: '6px' }} /\u003e\n  \u003cimg src=\"/images/projects/uniperks-before-categories.png\" alt=\"Before Categories\" style={{ width: '100%', borderRadius: '6px' }} /\u003e\n  \u003cimg src=\"/images/projects/uniperks-before-checkout.png\" alt=\"Before Checkout\" style={{ width: '100%', borderRadius: '6px' }} /\u003e\n\u003c/div\u003e\n\n## User Research \u0026 Persona\n\nUnderstanding student habits and motivations to build a seamless purchasing and reward system.\n\n\u003cimg src=\"/images/projects/uniperks-persona.png\" alt=\"User Persona\" style={{ width: '100%', borderRadius: '8px', margin: '20px 0' }} /\u003e\n\n## Wireframes \u0026 Iterations\n\nStarting with low-fidelity sketches and moving to digital wireframes in Figma.\n\n\u003cimg src=\"/images/projects/uniperks-hifi-screens.png\" alt=\"Hi-Fi Screens\" style={{ width: '100%', borderRadius: '8px', margin: '20px 0' }} /\u003e\n\n## Full Screen Mockups\n\n\u003cdiv style={{ display: 'flex', flexDirection: 'column', width: '100%', gap: '16px', margin: '20px 0' }}\u003e\n  \u003cimg src=\"/images/projects/UniPerks_Dashboard.png\" style={{ width: '100%', borderRadius: '8px' }} /\u003e\n  \u003cimg src=\"/images/projects/uniperks-mockup.png\" style={{ width: '100%', borderRadius: '8px' }} /\u003e\n\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L1e\",\"uniperks-design\",{\"priority\":false,\"href\":\"/work/uniperks-design\",\"images\":[\"/images/projects/uniperks-mockup.png\"],\"title\":\"UniPerks: UI/UX Case Study\",\"description\":\"Comprehensive UI/UX design case study for UniPerks, covering user research, competitive analysis, wireframing, design systems, and high-fidelity mockups.\",\"content\":\"$24\",\"avatars\":[{\"src\":\"/images/Ali.jpg\"}],\"link\":\"\"}]\n25:T473,\n## Overview\n\nA high-concurrency web allocation and residential governance portal engineered for Kolej Harun Aminurrashid (KHAR). Built to eliminate physical queues and uncoordinated spreadsheet records, the platform provides automated, real-time dormitory room selection for thousands of university students during high-traffic intake windows.\n\n## Core Architecture \u0026 Features\n\n- **Multi-Student Group Booking**: Synchronized application system allowing peer groups of 2 to 4 students to link records and register for adjacent dorm rooms simultaneously.\n- **Real-Time Allocation Engine**: Concurrency-safe room reservation pipeline with Livewire preventing double-booking race conditions during peak server loads.\n- **Administrative Control Hub**: Interactive dashboard for residential staff to monitor block capacity, filter student eligibility, and approve housing claims.\n\n## Technical Stack \u0026 Tools\n\n- **Full-Stack Framework**: Laravel, Livewire\n- **Styling \u0026 UI**: Tailwind CSS, Flux UI Components\n- **Access Control**: Spatie Laravel-Permission\n- **Database**: MySQL, SQLite\n- **DevOps \u0026 Cloud**: Docker, Fly.io Deployment Pipeline\n21:[\"$\",\"$L1e\",\"khar-hostel-portal\",{\"priority\":false,\"href\":\"/work/khar-hostel-portal\",\"images\":[\"/images/projects/khar-hostel-portal.png\"],\"title\":\"KHAR Hostel Portal\",\"description\":\"A high-concurrency web allocation and residential governance portal engineered for Kolej Harun Aminurrashid (KHAR).\",\"content\":\"$25\",\"avatars\":[{\"src\":\"/images/Ali.jpg\"}],\"link\":\"ht
